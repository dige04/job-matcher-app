version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Model configuration
      - ARTIFACT_DIR=/app/backend/artifacts
      - MODEL_URL=${MODEL_URL:-}
      - TOKENIZER_URL=${TOKENIZER_URL:-}
      - BASE_MODEL_URL=${BASE_MODEL_URL:-}
      - PHOBERT_BASE_DIR=${PHOBERT_BASE_DIR:-}
      
      # API configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ALLOWED_METHODS=${ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      - ALLOWED_HEADERS=${ALLOWED_HEADERS:-*}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount local artifacts directory for development
      - ./backend/artifacts:/app/backend/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  artifacts:
    driver: local